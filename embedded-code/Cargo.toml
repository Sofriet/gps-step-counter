[package]
name = "embedded-assignment-embedded"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
cortex-m-semihosting = "0.5.0"
critical-section = "1.1"
ringbuffer = { version ="0.16.0", default-features = false }
comm_protocol = { path = "../comm_protocol" }
# https://www.ti.com/lit/ds/symlink/lm3s6965.pdf
tudelft-lm3s6965-pac = {version = "0.1", features = ["rt"]}
